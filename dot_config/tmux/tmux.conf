# General Settings

set -g prefix C-b
bind C-b send-prefix

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g escape-time 0
set -g repeat-time 1000

set -g mouse off
set -g focus-events on
set -g allow-passthrough on

set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",*:RGB"

set-option -g status-keys vi
set-window-option -g mode-keys vi

# Keybindings

# start session with 1 instead of 0
bind-key s choose-tree -ZsK '#{?#{e|<:#{line},9},#{e|+:1,#{line}},#{?#{e|<:#{line},35},M-#{a:#{e|+:97,#{e|-:#{line},9}}},}}' -O name

bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"
bind C-p attach -t . -c "#{pane_current_path}"\; display "Path set"
bind C-x kill-window -a\; display "Other windows closed"
bind C-d kill-pane -a\; display "Other panes closed"

bind % split-window -h -c "#{pane_current_path}"
bind \" split-window -v -c "#{pane_current_path}"

bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Open tmux-session-select
bind f neww tmux-sessionizer
# Open notes_switcher
bind a split-window -h notes-switcher
# Popups live in their own key table: prefix + g, then the tool's letter.
# They used to be prefix + M-<letter>, but AeroSpace registers alt-a/c/k/l as
# global macOS hotkeys, so those chords never reached tmux.
bind g switch-client -T popup
bind -T popup k run-shell "tmux-popup k9s"
bind -T popup g run-shell "tmux-popup agy"
bind -T popup c run-shell "tmux-popup claude"
bind -T popup l run-shell "tmux-popup lazygit"
bind -T popup a run-shell "tmux-popup llm-serve-code"

# Copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Styling

# Status bar
set -g status-position top
set -g status-interval 1
set -g status-left-length 150
set -g status-right-length 150
set -g status-justify absolute-centre
accent='#c94f6d'     # attention: active window, messages, active pane border
highlight='#f4a261'  # prefix indicator + bell
muted='#aeafb0'       # dim: default status text, pane borders
session='#9d79d6'     # session name (status-left) + mode indicator
host_fg='#63cdcf'      # hostname (status-right); NOT 'host' -- #{host} is a tmux builtin (hostname)
window='#719cd6'       # inactive window label
bg='#131a24'            # dark fg for text sitting on a bright bg

# Prefix indicator: the whole bar flips to the highlight color while the prefix
# key is pending. Commas inside these two values are safe -- tmux splits the
# #{?} branches before it expands the variable, so the comma never reaches the
# conditional parser (see the #{E:...} note below).
status_prefix_style='bg=#{highlight},fg=#{bg},nobold'
status_normal_style='bg=default,fg=#{muted},nobold'
set -g status-style "#{E:#{?client_prefix,#{status_prefix_style},#{status_normal_style}}}"

prefix_style='#[bg=#{highlight},fg=#{bg}]'
normal_left_style='#[bg=default,fg=#{session}]'
normal_right_style='#[bg=default,fg=#{host_fg}]'

# #{E:...} is required, not decoration: the *_style values above are built from
# #{highlight}/#{bg}/#{session}, and tmux expands a config variable only one
# pass deep. Without E: the status bar gets a literal "bg=#{highlight}" and
# drops the style, so the prefix indicator never shows.
set -g status-left '#{E:#{?client_prefix,#{prefix_style},#{normal_left_style}}} #S'
set -g status-right '#{E:#{?client_prefix,#{prefix_style},#{normal_right_style}}}󰍹 #H'

# Windows
set -g window-status-separator ' '

# On prefix the bar is bright, so the window labels take the dark fg too;
# current vs inactive still reads via bold/underscore.
set -g window-status-current-format '#{E:#{?client_prefix,#[fg=#{bg}],#[fg=#{accent}]}}#[bold] #[underscore]#I:#W'
set -g window-status-format '#{E:#{?client_prefix,#[fg=#{bg}],#[fg=#{window}]}}#[bold] #I:#W'
set -g window-status-bell-style "fg=#{highlight}"

# Messages
set -g message-style "fg=#{accent},bg=default,bold"

# Mode (session selector, etc.)
set -g mode-style "fg=#{bg},bg=#{session}"

# Pane borders
set -g pane-border-status top
set -g pane-border-format '  #{pane_index}/#{window_panes} #(~/.local/bin/tmux-git-info "#{pane_current_path}")'
set -g pane-border-style 'fg=#{muted}'
set -g pane-active-border-style 'bg=default,fg=#{accent}'

# Vim-Tmux Navigator
# https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\'  'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

set -g extended-keys on
