# Languages, language servers, linters, formatters. Always in sbx boxes; on the
# host only while chezmoi data `devTools` isn't false (see README).
[tools]
black = "26.10.1"
bun = "1.4.4"
go = "1.27.4"
hadolint = "2.15.1"
lua-language-server = "3.19.2"
markdownlint-cli2 = "0.24.0"
marksman = "2026-02-08"
mongosh = "2.14.1"
node = "26.13.1"
"npm:yaml-language-server" = "2.0.0"
"pipx:flake8" = "7.5.0"
"pipx:isort" = "9.0.2"
"pipx:pyright" = "1.1.414"
python = "3.15.2"
ruby = "4.0.9"
ruff = "0.17.4"
shellcheck = "0.11.0"
shfmt = "3.14.1"
stylua = "2.6.0"
taplo = "0.10.0"
# pipx:* tools install through uv; boxes have no pipx.
uv = "0.13.7"
yamlfmt = "0.21.0"
