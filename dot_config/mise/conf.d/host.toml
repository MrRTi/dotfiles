# Host only: secrets (fnox + Secure Enclave age keys), backups, accounting,
# Apple Photos and Apple GPU tools. Boxes run agents, so nothing here goes
# into them.
# NOTE: the pipx tools pin python: without it uv picked the oldest Python each
# allows, macOS's /usr/bin/python3 3.9 (LibreSSL) for httpie (tested). mise
# installs that Python privately for the tool; mlx runs on the GPU (tested).
[tools]
age = "1.3.2"
dive = "0.13.1"
fnox = "1.48.0"
"github:remko/age-plugin-se" = "0.2.1"
hledger = "1.52.4"
"pipx:httpie" = { version = "3.2.4", python = "3.14" }
"pipx:mlx-lm" = { version = "0.32.2", python = "3.14" }
"pipx:osxphotos" = { version = "0.78.1", python = "3.14" }
rclone = "1.76.0"
restic = "0.19.1"
trivy = "0.76.2"
