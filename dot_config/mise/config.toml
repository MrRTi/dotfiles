# NOTE: global config. `mise use -g` / `mise upgrade --bump` edit the deployed
# copy; pull that back with `chezmoi re-add ~/.config/mise` (`just update` does).
# Tools are split by where they're needed:
#   config.toml        everywhere (host and sbx boxes)
#   conf.d/dev.toml    languages, LSPs, linters (boxes; host while devTools)
#   conf.d/host.toml   host only (secrets, backups, accounting)
#   conf.d/infra.toml  host only for now (k8s, vault, tofu)
# Never set MISE_GLOBAL_CONFIG_FILE: mise then skips conf.d (tested).

[settings]
auto_install = true
idiomatic_version_file_enable_tools = ["ruby"]
# NOTE: no mise.lock. The exact pins below already give host and boxes the same
# versions, and downloads are still verified without a lock (GitHub digests,
# plus attestations/cosign where published; tested). The lock only added pinned
# checksums and npm/pipx dependency graphs, at the cost of sidecar files and
# hand pruning.
lockfile = false

[settings.status]
missing_tools = "always"
show_env = true
show_tools = true

[task_config]
# Global rails:* tasks; ~ paths work here (tested).
includes = ["~/.config/mise/rails-tasks.toml"]

[hooks]
# Installs default-gems into every newly installed ruby, global or from a
# project's .ruby-version (tested: the global hook fires for both). Replaces
# the deprecated ruby.default_packages_file (removed in mise 2027.11).
postinstall = '''
printf '%s' "$MISE_INSTALLED_TOOLS" | grep -o '"name":"ruby"[^}]*' |
	sed -n 's/.*"install_path":"\([^"]*\)".*/\1/p' |
	while IFS= read -r ruby; do
		"$ruby/bin/gem" install --no-document $(grep -v '^#' "$HOME/.config/mise/default-gems")
	done
'''

# NOTE: lsd and bottom replace eza and btop, which have no macOS release for
# mise to install. neovim is pinned to stable so host and boxes run the same
# build; "nightly" works but changes daily.
# aqua, not the registry default vfox:jdx/vfox-neovim: same neovim/neovim
# release tarballs, without cloning and running a plugin.
[tools]
"aqua:neovim/neovim" = "0.12.6"
bat = "0.26.1"
bottom = "0.15.0"
delta = "0.20.1"
dust = "1.2.7"
fd = "10.5.2"
fzf = "0.75.0"
glow = "3.0.0"
jnv = "0.7.1"
jq = "1.8.2"
just = "1.59.0"
lazygit = "0.66.3"
lsd = "1.2.0"
pi = "1.5.2"
ripgrep = "15.2.0"
tealdeer = "1.9.1"
tmux = "3.8"
tree-sitter = "0.27.2"
usql = "0.21.6"
# pipx:* tools in every conf.d file install through uv; pipx is not installed.
uv = "0.13.7"
yq = "4.54.3"
