[settings]
auto_install = true
idiomatic_version_file_enable_tools = ["ruby"]

[settings.ruby]
default_packages_file = "~/.config/mise/default-gems"

[settings.status]
missing_tools = "always"
show_env = true
show_tools = true

[task_config]
# Global rails:* tasks; ~ paths work here (tested).
includes = ["~/.config/mise/rails-tasks.toml"]

[tools]
age = "1.3.2"
black = "26.10.1"
bun = "1.4.4"
fnox = "1.48.0"
"github:remko/age-plugin-se" = "0.2.1"
go = "1.27.4"
hadolint = "2.15.1"
lua-language-server = "3.19.2"
markdownlint-cli2 = "0.24.0"
marksman = "2026-02-08"
node = "26.13.1"
"npm:yaml-language-server" = "2.0.0"
"pipx:flake8" = "7.5.0"
"pipx:isort" = "9.0.2"
"pipx:pyright" = "1.1.414"
python = "3.15.2"
ruby = "4.0.9"
ruff = "0.17.4"
shellcheck = "0.11.0"
shfmt = "3.14.1"
stylua = "2.6.0"
taplo = "0.10.0"
yamlfmt = "0.21.0"
