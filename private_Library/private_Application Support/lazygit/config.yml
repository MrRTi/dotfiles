# NOTE: lazygit ignores `core.pager = delta` from ~/.config/git/config and only
# pipes through delta when listed in `git.diffRenderers`. Its built-in renderer
# is plain line red/green with no word-level or syntax highlighting. Two delta
# renderers are listed; `|` cycles between them.
# Inline is first because side-by-side halves an already narrow panel. delta
# reads the [delta] section of the git config, where `side-by-side = true`
# can't be undone by a CLI flag (`--features` doesn't override it), so the
# inline renderer skips the git config with `--no-gitconfig` and passes
# `--line-numbers` itself; the side-by-side one just uses the git config.
# `{{colorScheme}}` makes lazygit pass dark/light, following macOS appearance.
#
# `sidePanelWidth` shrinks the left column (default 0.3333) so the diff panel
# gets more room; `+` still toggles half/full screen when that's not enough.
#
# NOTE: only one key is overridden here on purpose. lazygit's other theme
# defaults are ANSI colour *names*, so they follow whichever palette Ghostty
# swaps in (Kanagawa Dragon when macOS is dark, Lotus when light) and stay
# readable in both. Hardcoding Kanagawa hex values would pin the theme to one
# appearance -- measured against Lotus, a hardcoded dark selection put diff text
# at 2.66:1 and the foreground at 1.40:1.
#
# The default `selectedLineBgColor` is `blue`, which is Dragon's ANSI blue
# #8ba4b0 -- a *light* desaturated blue. Red/green diff text over it measures
# 1.15-1.32:1, i.e. the line under the cursor is unreadable. `reverse` swaps
# foreground and background per cell instead of picking a colour, so the
# selected line always has the same contrast as ordinary diff text
# (Dragon 5.21/6.00, Lotus 4.06/3.26) in either appearance.
gui:
  theme:
    selectedLineBgColor:
      - reverse
  sidePanelWidth: 0.25
git:
  diffRenderers:
    - name: delta
      command: delta --no-gitconfig --{{colorScheme}} --paging=never --line-numbers
    - name: delta side-by-side
      command: delta --{{colorScheme}} --paging=never --width={{width}}
