---
name: "global"

services:
  redis:
    container_name: global_redis--8.6.0--3.23
    image: redis:8.6.0-alpine3.23
    command: redis-server
    ports:
      - 6379:6379

  postgres:
    container_name: global_postgres--18.1--3.23
    image: postgres:18.1-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: global_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mysql:
    container_name: global_mysql--8.0.45
    image: mysql:8.0.45
    command: --sql_mode=""
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    ports:
      - 3306:3306
    volumes:
      - mysql_data:/var/lib/mysql

  mongo:
    container_name: global_mongo--8.2.5
    image: mongo:8.2.5
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: global_db
    ports:
      - 27017:27017
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mysql_data:
  mongo_data:
